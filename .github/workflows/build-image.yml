# Builds the bot image and pushes it to GHCR.
#
# Exists because a laptop is the wrong machine for this. The runner is natively
# x86_64, so the image is built for the architecture the CVM actually runs
# without emulation -- and without the class of surprise that costs an
# afternoon: safe-pysha3 publishes wheels only for x86_64, so an arm64 build
# falls back to compiling it and fails on an image with no gcc. The runner also
# sits next to GHCR, which turns a ten-minute upload into seconds.
#
# The digest this prints is the value that goes in docker-compose.yml. Pin by
# digest, never by tag: the digest is measured by tapp and registered on chain,
# so a tag that moves underneath the deployment becomes a verification failure
# rather than an upgrade.

name: Build Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: false
        default: dev
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the build provenance attestation below.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
          # GHCR paths are lowercase; a mixed-case owner is rejected on push.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      # Built and loaded before it is pushed, so the smoke test below runs on
      # exactly the artifact that gets published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The unit tests cannot catch what this catches. A developer venv has
      # grpcio-tools installed to generate the stubs, which drags in protobuf --
      # so the suite passed for a while against an image that had no protobuf
      # and died on its first import. Running the built artifact is the only
      # check that sees that class of gap.
      - name: Smoke test the built image
        run: |
          docker run --rm --entrypoint sh \
            "${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.value }}" -c '
              set -e
              test "$(id -u)" = "10001" || { echo "not running as uid 10001"; exit 1; }
              touch /state/.probe && rm /state/.probe
              python - <<PY
          import sys
          sys.path.insert(0, "/app/src")
          import grpc, google.protobuf
          from tapp import inject_tee_keys, tapp_service_pb2_grpc
          import scheduler, cli, main          # every entrypoint
          assert inject_tee_keys() is None, "must be a no-op without TAPP_APP_ID"
          print("smoke ok:", google.protobuf.__version__, grpc.__version__)
          PY
            '

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha

      # Ties the published digest to this commit and this workflow run, which is
      # what makes a public image worth publishing: the on-chain digest becomes
      # traceable to source instead of an opaque number.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.tag.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Digest for docker-compose.yml
        run: |
          echo "### Pin this in docker-compose.yml" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "    image: ${{ steps.tag.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
