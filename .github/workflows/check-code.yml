name: Check Code

on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/check-code.yml'

jobs:
  check-code:
    name: Check Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Check formatting with Black
      run: black --check .

    # After the formatting check, deliberately: protoc output is not Black-clean
    # and is gitignored for the same reason it is generated here rather than
    # committed -- it is pinned to the grpcio that produced it.
    #
    # Without this step the tapp signer's end-to-end tests skip themselves, and
    # a skipped test that guards the bot's signing key reads as a passing one.
    - name: Generate tapp gRPC stubs
      run: |
        pip install grpcio-tools==1.83.0
        ./scripts/gen_proto.sh

    - name: Run tests
      run: python -m unittest discover -s tests -p "test_*.py" -v
